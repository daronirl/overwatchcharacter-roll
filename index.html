<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Overwatch Character Roll</title>
</head>
<body>
   
  
<div class="container">

    <header class="app-header">
        <h1>Overwatch Hero Randomizer</h1>
        <p>Can't decide who to play? Let fate choose!</p>
    </header>

    <main class="hero-selector">

        <h2>Choose Your Role</h2>

        <div class="role-buttons">
            <button class="tank">Tank</button>
            <button class="damage">Damage</button>
            <button class="heals">Support</button>
        </div>

        <div class="hero-card">
            <img src="" class="imgToon" alt="" hidden>

            <h3 id="hero-display" aria-live="polite">
                Your hero awaits...
            </h3>
        </div>

    </main>

</div>


<script src="app.js"></script>
<script src="script.js"></script>
</body>
</html>
